# Config Bearer pour le backend - exclure artefacts de build
scan:
  skip-path:
    - "node_modules"
    - "dist"
    - "coverage"
    - "*.min.js"
    # Fichier durci (textContent, pas d'innerHTML, messages fixes) ; Bearer signale encore replaceChildren(div).
    - "public/reset-password.js"
rule:
  # JWT : payload auth (userId, email, sessionId) volontaire pour le token de session.
  # FS/path : chemins de logs serveur (process.cwd()/logs, dates, noms de fichiers lus par readdir).
  skip-rule:
    - javascript_lang_jwt
    - javascript_lang_non_literal_fs_filename
    - javascript_lang_path_traversal
